name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: tafaqqah
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/tafaqqah
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/tafaqqah_test
      # Throwaway CI-only values; the mock provider is development-only and refused in production.
      AI_PROVIDER: mock
      ADMIN_EMAIL: admin@ci.local
      ADMIN_PASSWORD: ci-admin-password-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create test database
        run: PGPASSWORD=ci psql -h localhost -U ci -d tafaqqah -c "CREATE DATABASE tafaqqah_test;"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build # before tests: the client-bundle secret test (P) inspects .next/static
      - run: npm test
      - name: Seed demo content
        run: npm run db:deploy && npm run db:seed
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end journeys (desktop + mobile)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-artifacts
          path: e2e-artifacts/
          retention-days: 7
